<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1290" viewBox="0 0 1280 1290" role="img"><title>调用链 A：检查缺项并返回依据</title><desc>紫色：模型调用   绿色：程序调用   蓝色：数据读取   金色：状态写入 · 这里展示一种成功路径，模型调用次数可变化</desc><rect x="0" y="0" width="1280" height="1290" rx="0" fill="#f4f7f3" stroke="#d6e2da" /><defs><marker id="a176b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b53" /></marker><marker id="a326587" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326587" /></marker><marker id="a6d5594" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d5594" /></marker><marker id="aa67320" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67320" /></marker></defs><text x="40" y="44" fill="#183a39" font-size="27" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">调用链 A：检查缺项并返回依据</tspan></text><text x="40" y="76" fill="#627a71" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">紫色：模型调用   绿色：程序调用   蓝色：数据读取   金色：状态写入 · 这里展示一种成功路径，模型调用次数可变化</tspan></text><rect x="10" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="110" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="110" dy="0">用户 / 浏览器</tspan></text><path d="M 110 147 V 1270" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="265" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="365" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="365" dy="0">Application / ChatSession</tspan></text><path d="M 365 147 V 1270" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="520" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="620" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620" dy="0">Ollama / qwen3:8b</tspan></text><path d="M 620 147 V 1270" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="775" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="875" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="875" dy="0">Service / Memory</tspan></text><path d="M 875 147 V 1270" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="1030" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="1130" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1130" dy="0">SQLite / 内存 / JSONL</tspan></text><path d="M 1130 147 V 1270" stroke="#ccd9d0" stroke-dasharray="5 5" /><path d="M 110 203 L 365 203" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="53.5" y="151" width="368" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="171" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">01  POST /api/chat：检查2026年9月用途缺项</tspan></text><path d="M 365 277 L 1130 277" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="569.5" y="225" width="356" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="747.5" y="245" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="747.5" dy="0">02  读 tasks、preferences；构建本轮上下文</tspan></text><path d="M 365 351 L 620 351" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="272.5" y="299" width="440" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="319" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">03  第1次模型请求：system + 记忆 + 最近对话 + tools</tspan></text><path d="M 620 425 L 365 425" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="266.5" y="373" width="452" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="393" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">04  返回 tool_call：check(month="2026-09")</tspan></text><path d="M 365 499 L 875 499" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="466.0" y="447" width="308" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="620.0" y="467" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620.0" dy="0">05  校验月份来源，固定注入 U001 / C001</tspan></text><path d="M 875 573 L 1130 573" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="806.5" y="521" width="392" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="1002.5" y="541" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1002.5" dy="0">06  读 permissions、启用规则及当前 invoices</tspan></text><path d="M 1130 647 L 875 647" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="878.5" y="595" width="248" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="1002.5" y="615" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1002.5" dy="0">07  返回五张缺项与 R002 2.0 版</tspan></text><path d="M 875 721 L 365 721" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="514.0" y="669" width="212" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="620.0" y="689" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620.0" dy="0">08  返回结构化检查结果，不修改发票</tspan></text><path d="M 365 795 L 1130 795" fill="none" stroke="#a67320" stroke-width="2" marker-end="url(#aa67320)" /><rect x="521.5" y="743" width="452" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="747.5" y="763" fill="#a67320" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="747.5" dy="0">09  Memory.track：写 tasks / state_events</tspan></text><path d="M 365 869 L 620 869" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="320.5" y="817" width="344" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="837" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">10  第2次模型请求：加入 role=tool 的实际结果</tspan></text><path d="M 620 943 L 365 943" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="404.5" y="891" width="176" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="911" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">11  返回解释、缺项编号及依据</tspan></text><path d="M 365 1017 L 110 1017" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="65.5" y="965" width="344" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="985" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">12  JSON：reply、pending；浏览器展示回答</tspan></text><path d="M 110 1091 L 365 1091" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="71.5" y="1039" width="332" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="1059" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">13  随后 POST /api/state 刷新资料面板</tspan></text><path d="M 365 1165 L 1130 1165" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="617.5" y="1113" width="260" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="747.5" y="1133" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="747.5" dy="0">14  直接读当前资料和任务快照，不再调用模型</tspan></text><rect x="35" y="1196" width="1210" height="49" rx="7" fill="#e9f0e7" stroke="#d6e2da" /><text x="55" y="1226" fill="#183a39" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="55" dy="0">每轮持续追加JSONL；totals查询本身不创建任务，check才调用Memory.track。</tspan></text></svg>