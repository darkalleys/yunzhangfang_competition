<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img"><title>财税助手实际架构</title><desc>代码基线 bab7940 / 0.4.0 · 只有自然语言分支调用 qwen3:8b · 双向线表示请求与返回</desc><rect x="0" y="0" width="1280" height="1120" rx="0" fill="#f4f7f3" stroke="#d6e2da" /><defs><marker id="a176b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b53" /></marker><marker id="a326587" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326587" /></marker><marker id="a6d5594" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d5594" /></marker><marker id="aa67320" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67320" /></marker></defs><text x="40" y="44" fill="#183a39" font-size="27" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">财税助手实际架构</tspan></text><text x="40" y="76" fill="#627a71" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">代码基线 bab7940 / 0.4.0 · 只有自然语言分支调用 qwen3:8b · 双向线表示请求与返回</tspan></text><rect x="40" y="120" width="350" height="105" rx="13" fill="#fff" stroke="#d6e2da" /><text x="58" y="150" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">浏览器用户</tspan></text><text x="58" y="177" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">选择用户、企业和月份</tspan><tspan x="58" dy="22.400000000000002">自然语言、确认按钮、资料面板</tspan></text><rect x="450" y="120" width="350" height="105" rx="13" fill="#fff" stroke="#d6e2da" /><text x="468" y="150" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">终端对话用户</tspan></text><text x="468" y="177" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">chat进入自然语言处理</tspan><tspan x="468" dy="22.400000000000002">显式偏好与任务控制命令</tspan></text><rect x="860" y="120" width="350" height="105" rx="13" fill="#fff" stroke="#d6e2da" /><text x="878" y="150" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">结构化CLI与本地维护</tspan></text><text x="878" y="177" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">menu / 业务命令 / manage.py</tspan><tspan x="878" dy="22.400000000000002">init / migrate / backup.py</tspan></text><rect x="40" y="325" width="350" height="140" rx="13" fill="#fff" stroke="#d6e2da" /><text x="58" y="355" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">web.py / Application</tspan></text><text x="58" y="382" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">本机HTTP · 来源和会话校验</tspan><tspan x="58" dy="22.400000000000002">固定身份与企业 · 会话锁</tspan><tspan x="58" dy="22.400000000000002">按钮分支直接调用程序工具</tspan></text><rect x="450" y="325" width="350" height="140" rx="13" fill="#fff" stroke="#d6e2da" /><text x="468" y="355" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">chat.py / ChatSession</tspan></text><text x="468" y="382" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">上下文：身份、月份、最近对话</tspan><tspan x="468" dy="22.400000000000002">读取任务偏好 · 模型工具循环</tspan><tspan x="468" dy="22.400000000000002">保存草稿、确认与错误处理</tspan></text><rect x="860" y="325" width="350" height="140" rx="13" fill="#fff" stroke="#d6e2da" /><text x="878" y="355" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">程序直达与维护模块</tspan></text><text x="878" y="382" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">Service：结构化业务CLI</tspan><tspan x="878" dy="22.400000000000002">knowledge/state：规则、记忆、迁移</tspan><tspan x="878" dy="22.400000000000002">maintenance/store：备份、导入</tspan></text><rect x="40" y="570" width="350" height="130" rx="13" fill="#f0ecf7" stroke="#d6e2da" /><text x="58" y="600" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">Ollama / qwen3:8b</tspan></text><text x="58" y="627" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">本机11434端口 /api/chat</tspan><tspan x="58" dy="22.400000000000002">理解、工具请求和回答生成</tspan><tspan x="58" dy="22.400000000000002">bge-m3未接入；无独立检测模型</tspan></text><rect x="450" y="570" width="350" height="130" rx="13" fill="#fff" stroke="#d6e2da" /><text x="468" y="600" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">业务工具与程序校验</tspan></text><text x="468" y="627" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">Service：totals/check/invoice/update</tspan><tspan x="468" dy="22.400000000000002">ChatSession.dispatch：rules/prepare</tspan><tspan x="468" dy="22.400000000000002">prepare_update仅生成内存草稿</tspan></text><rect x="860" y="570" width="350" height="130" rx="13" fill="#fff" stroke="#d6e2da" /><text x="878" y="600" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">state.py / Memory</tspan></text><text x="878" y="627" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">每个用户、企业一个活动任务</tspan><tspan x="878" dy="22.400000000000002">显式偏好管理 · 当前数据复查</tspan><tspan x="878" dy="22.400000000000002">不保存草稿或修改授权</tspan></text><rect x="40" y="840" width="350" height="135" rx="13" fill="#fff" stroke="#d6e2da" /><text x="58" y="870" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">JSONL运行记录</tspan></text><text x="58" y="897" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="58" dy="0">实际模型输入、输出与工具结果</tspan><tspan x="58" dy="22.400000000000002">选用记忆、规则、保存回读</tspan><tspan x="58" dy="22.400000000000002">日志不是自动载入的会话记忆</tspan></text><rect x="450" y="840" width="350" height="135" rx="13" fill="#fff" stroke="#d6e2da" /><text x="468" y="870" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">SQLite / 业务与规则</tspan></text><text x="468" y="897" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="468" dy="0">企业、用户、权限、发票、流水</tspan><tspan x="468" dy="22.400000000000002">rules / audit_log / metadata</tspan><tspan x="468" dy="22.400000000000002">金额用整数分，发票按企业定位</tspan></text><rect x="860" y="840" width="350" height="135" rx="13" fill="#fff" stroke="#d6e2da" /><text x="878" y="870" fill="#183a39" font-size="18" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">SQLite / 任务与偏好</tspan></text><text x="878" y="897" fill="#50695e" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="878" dy="0">tasks / preferences</tspan><tspan x="878" dy="22.400000000000002">state_events / rule_events</tspan><tspan x="878" dy="22.400000000000002">与业务表位于同一数据库文件</tspan></text><path d="M 215 225 L 215 325" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" /><text x="230" y="280" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="230" dy="0">HTTP / JSON</tspan></text><path d="M 390 390 L 450 390" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" /><path d="M 390 445 L 400 445 L 400 560 L 470 560 L 470 570" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" stroke-dasharray="5 5" /><text x="420" y="550" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="420" dy="0">按钮直达工具</tspan></text><path d="M 625 225 L 625 325" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" /><text x="640" y="280" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="640" dy="0">自然语言</tspan></text><path d="M 1035 225 L 1035 325" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" /><text x="1050" y="280" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="1050" dy="0">显式管理</tspan></text><path d="M 450 440 L 415 440 L 415 540 L 215 540 L 215 570" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" marker-start="url(#a6d5594)" /><text x="55" y="520" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="55" dy="0">模型请求 / 工具请求 / 文本</tspan></text><path d="M 625 465 L 625 570" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" /><text x="640" y="525" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="640" dy="0">工具分发 / 结果</tspan></text><path d="M 800 425 L 830 425 L 830 520 L 1035 520 L 1035 570" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" marker-start="url(#a176b53)" /><text x="895" y="505" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="895" dy="0">记忆载入 / 进度刷新</tspan></text><path d="M 625 700 L 625 840" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" marker-start="url(#a326587)" /><text x="640" y="777" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="640" dy="0">授权查询 / 事务保存</tspan></text><path d="M 1035 700 L 1035 840" fill="none" stroke="#a67320" stroke-width="2" marker-end="url(#aa67320)" marker-start="url(#aa67320)" /><text x="890" y="777" fill="#a67320" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="890" dy="0">读写任务、偏好与事件</tspan></text><path d="M 450 455 L 440 455 L 440 745 L 20 745 L 20 910 L 40 910" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" stroke-dasharray="5 5" /><path d="M 1210 395 L 1240 395 L 1240 1020 L 625 1020 L 625 975" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><text x="690" y="1045" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="690" dy="0">规则管理、迁移、备份也直接访问数据库，不调用模型</tspan></text><text x="40" y="1088" fill="#183a39" font-size="16" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">返回：工具结果交回同一个模型组织回答；确认保存、资料刷新和偏好按钮由程序直接返回。</tspan></text><text x="40" y="1110" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">业务与状态框表示同一business.sqlite3的不同表；JSONL为独立文件。</tspan></text></svg>