<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1660" viewBox="0 0 1280 1660" role="img"><title>调用链 B：提出修改、确认、事务保存与回读</title><desc>紫色：模型调用   绿色：程序调用   蓝色：数据读取   金色：状态写入 · 这里展示一种成功路径，模型调用次数可变化</desc><rect x="0" y="0" width="1280" height="1660" rx="0" fill="#f4f7f3" stroke="#d6e2da" /><defs><marker id="a176b53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b53" /></marker><marker id="a326587" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326587" /></marker><marker id="a6d5594" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d5594" /></marker><marker id="aa67320" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a67320" /></marker></defs><text x="40" y="44" fill="#183a39" font-size="27" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">调用链 B：提出修改、确认、事务保存与回读</tspan></text><text x="40" y="76" fill="#627a71" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="40" dy="0">紫色：模型调用   绿色：程序调用   蓝色：数据读取   金色：状态写入 · 这里展示一种成功路径，模型调用次数可变化</tspan></text><rect x="10" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="110" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="110" dy="0">用户 / 浏览器</tspan></text><path d="M 110 147 V 1640" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="265" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="365" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="365" dy="0">Application / ChatSession</tspan></text><path d="M 365 147 V 1640" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="520" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="620" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620" dy="0">Ollama / qwen3:8b</tspan></text><path d="M 620 147 V 1640" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="775" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="875" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="875" dy="0">Service / Memory</tspan></text><path d="M 875 147 V 1640" stroke="#ccd9d0" stroke-dasharray="5 5" /><rect x="1030" y="100" width="200" height="45" rx="8" fill="#fff" stroke="#d6e2da" /><text x="1130" y="128" fill="#183a39" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1130" dy="0">SQLite / 内存 / JSONL</tspan></text><path d="M 1130 147 V 1640" stroke="#ccd9d0" stroke-dasharray="5 5" /><path d="M 110 203 L 365 203" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="35.5" y="151" width="404" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="171" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">01  POST /api/chat：F002用途填为员工培训资料打印</tspan></text><path d="M 365 277 L 620 277" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="362.5" y="225" width="260" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="245" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">02  模型理解目标、字段和用户明确给出的内容</tspan></text><path d="M 620 351 L 365 351" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="206.5" y="299" width="572" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="319" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">03  tool_call：prepare_update(invoice_id, changes)</tspan></text><path d="M 365 425 L 875 425" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="478.0" y="373" width="284" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="620.0" y="393" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620.0" dy="0">04  校验内容来源、字段白名单、权限并读取原发票</tspan></text><path d="M 365 499 L 1130 499" fill="none" stroke="#a67320" stroke-width="2" marker-end="url(#aa67320)" /><rect x="593.5" y="447" width="308" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="747.5" y="467" fill="#a67320" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="747.5" dy="0">05  仅写 pending 内存草稿；并追加运行日志</tspan></text><path d="M 365 573 L 620 573" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="374.5" y="521" width="236" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="541" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">06  把“草稿未保存”的工具结果交回模型</tspan></text><path d="M 620 647 L 365 647" fill="none" stroke="#6d5594" stroke-width="2" marker-end="url(#a6d5594)" /><rect x="428.5" y="595" width="128" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="492.5" y="615" fill="#6d5594" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="492.5" dy="0">07  模型生成草稿说明</tspan></text><path d="M 365 721 L 110 721" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="41.5" y="669" width="392" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="689" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">08  展示草稿及operation_id；此时没有业务UPDATE</tspan></text><path d="M 110 795 L 365 795" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="25" y="743" width="488" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="763" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">09  点击确认保存：POST /api/confirm(operation_id)</tspan></text><rect x="35" y="826" width="1210" height="49" rx="7" fill="#e9f0e7" stroke="#d6e2da" /><text x="55" y="856" fill="#6d5594" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="55" dy="0">以下确认保存分支不调用模型；CLI的/confirm也走同一程序分支。</tspan></text><path d="M 365 943 L 875 943" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="442.0" y="891" width="356" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="620.0" y="911" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620.0" dy="0">11  检查草稿编号及快照，调用 Service.update</tspan></text><path d="M 875 1017 L 1130 1017" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="818.5" y="965" width="368" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="1002.5" y="985" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1002.5" dy="0">12  BEGIN IMMEDIATE：查权限、幂等编号和原发票</tspan></text><path d="M 875 1091 L 1130 1091" fill="none" stroke="#a67320" stroke-width="2" marker-end="url(#aa67320)" /><rect x="752.5" y="1039" width="500" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="1002.5" y="1059" fill="#a67320" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1002.5" dy="0">13  同一事务：UPDATE invoices + INSERT audit_log</tspan></text><rect x="35" y="1122" width="1210" height="49" rx="7" fill="#e9f0e7" stroke="#d6e2da" /><text x="55" y="1152" fill="#a67320" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="55" dy="0">数据库COMMIT成功之后，才开始业务回读与后续任务刷新。</tspan></text><path d="M 875 1239 L 1130 1239" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="878.5" y="1187" width="248" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="1002.5" y="1207" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1002.5" dy="0">15  新数据库连接 SELECT 当前发票</tspan></text><path d="M 1130 1313 L 875 1313" fill="none" stroke="#326587" stroke-width="2" marker-end="url(#a326587)" /><rect x="902.5" y="1261" width="200" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="1002.5" y="1281" fill="#326587" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="1002.5" dy="0">16  返回当前用途、备注及保存状态</tspan></text><path d="M 875 1387 L 365 1387" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="544.0" y="1335" width="152" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="620.0" y="1355" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="620.0" dy="0">17  返回已保存与回读结果</tspan></text><path d="M 365 1461 L 1130 1461" fill="none" stroke="#a67320" stroke-width="2" marker-end="url(#aa67320)" /><rect x="467.5" y="1409" width="560" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="747.5" y="1429" fill="#a67320" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="747.5" dy="0">18  Memory.refresh：重新检查，单独写 tasks / state_events</tspan></text><path d="M 365 1535 L 110 1535" fill="none" stroke="#176b53" stroke-width="2" marker-end="url(#a176b53)" /><rect x="65.5" y="1483" width="344" height="48" rx="3" fill="#f4f7f3" stroke="none" /><text x="237.5" y="1503" fill="#176b53" font-size="13" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="middle"><tspan x="237.5" dy="0">19  程序生成保存结果；若任务刷新失败，明确显示保存已完成</tspan></text><rect x="35" y="1566" width="1210" height="49" rx="7" fill="#e9f0e7" stroke="#d6e2da" /><text x="55" y="1596" fill="#183a39" font-size="14" font-family="Microsoft YaHei, Segoe UI, sans-serif" text-anchor="start"><tspan x="55" dy="0">业务保存事务与任务更新不是同一事务；新会话只恢复任务与偏好，不恢复pending。</tspan></text></svg>